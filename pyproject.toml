[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "nixorb"
dynamic = ["version"]
description = "Floating AI assistant orb for Arch Linux — KDE Plasma 6 Wayland"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "NixOrb Contributors" }]
keywords = ["ai", "assistant", "wayland", "kde", "llm", "tts", "asr", "local"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "PySide6>=6.7.0",
    "qasync>=0.27.1",
    "faster-whisper>=1.0.3",
    "aiohttp>=3.9.5",
    "sounddevice>=0.4.7",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tomli-w>=1.0.0",
    "typer[all]>=0.12.3",
    "chromadb>=0.5.3",
    "pynput>=1.7.6",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-aiohttp>=1.0",
    "pytest-qt>=4.2",
    "ruff>=0.4",
    "mypy>=1.10",
]
wakeword = ["openwakeword>=0.6.0"]
# Local HuggingFace LLM/ASR/TTS models (transformers) — needed for
# llm_backend="huggingface", asr_backend="huggingface", tts_backend="huggingface".
# Pick a torch build matching your GPU; see requirements-cuda.txt for the
# GTX 1080 (CUDA 11.8) pin this project targets.
huggingface = [
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "huggingface_hub>=0.24.0",
]
# GGUF models via llama.cpp — needed for llm_backend="huggingface" when
# llm_model/llm_gguf_file points at a GGUF checkpoint.
llama_cpp = ["llama-cpp-python>=0.2.90"]
# Any OpenAI-compatible endpoint (real OpenAI, or a local vLLM / TGI /
# LM Studio / llama.cpp server) — llm_backend="openai" or tts_backend="openai".
openai = ["openai>=1.40.0"]

[project.scripts]
nixorb = "nixorb.cli:app"

[project.gui-scripts]
nixorb-gui = "nixorb.main:main"

[project.urls]
Homepage = "https://github.com/minerofthesoal/nixorb"
Repository = "https://github.com/minerofthesoal/nixorb"
Issues = "https://github.com/minerofthesoal/nixorb/issues"

[tool.hatch.version]
path = "nixorb/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["nixorb"]

[tool.hatch.build.targets.wheel.shared-data]
"assets" = "share/nixorb/assets"
"config" = "share/nixorb/config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM102", "SIM117"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
