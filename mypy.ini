[mypy]
python_version         = 3.12
ignore_missing_imports = True
warn_unused_ignores    = False
strict                 = False
exclude                = tests/

[mypy-PySide6.*]
ignore_missing_imports = True

[mypy-faster_whisper.*]
ignore_missing_imports = True

[mypy-sounddevice.*]
ignore_missing_imports = True

[mypy-openwakeword.*]
ignore_missing_imports = True

[mypy-chromadb.*]
ignore_missing_imports = True

[mypy-llama_cpp.*]
ignore_missing_imports = True

# Legacy pre-v2 backends. NixOrb v2 is local-only (Ollama + Piper), so these
# are not reachable from main.py or cli.py, and they still read Settings
# fields (tts_hf_repo, hf_token, openai_api_key) that v2 removed. Kept for
# reference until someone decides whether to revive or delete them.
[mypy-nixorb.tts.hf_tts]
ignore_errors = True

[mypy-nixorb.tts.glados_tts]
ignore_errors = True

[mypy-nixorb.tts.openai_tts]
ignore_errors = True
